name: embedded_sdk_docker

on:
  push:
  pull_request:
    branches:
        - main

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout@v6.0.3
            - name: Login to GitHub Container Registry
              uses: docker/login-action@v1
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  context: .
            - name: Build docker image
              run: |
                    docker build . --file dockerfile --tag ghcr.io/mitchellthompkins/embedded_sdk:latest
                    docker run ghcr.io/mitchellthompkins/embedded_sdk:latest
            - name: Publish docker image
              if: github.ref == 'refs/heads/main'
              run: docker push ghcr.io/mitchellthompkins/embedded_sdk:latest
